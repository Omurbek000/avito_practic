{% extends "admin/base.html" %}
{% load static i18n %}

{% block title %}{{ title }} | Avito Admin{% endblock %}

{% block extrastyle %}
{{ block.super }}
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #e8c96a;
    --gold-dim: rgba(201,168,76,0.15);
    --purple: #7c3fbf;
    --purple-light: #a06bdf;
    --purple-dim: rgba(124,63,191,0.15);
    --bg: #080010;
    --bg2: #0e0018;
    --glass: rgba(255,255,255,0.03);
    --glass-border: rgba(160,100,255,0.12);
    --glass-border-gold: rgba(201,168,76,0.2);
    --text: rgba(255,255,255,0.85);
    --text-dim: rgba(255,255,255,0.4);
    --text-muted: rgba(255,255,255,0.2);
  }

  * { box-sizing: border-box; }

  body, html {
    background: var(--bg) !important;
    color: var(--text) !important;
    font-family: 'Inter', sans-serif !important;
    min-height: 100vh;
  }

  /* Background ambient glows */
  body::before {
    content: '';
    position: fixed; top: -200px; left: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(124,63,191,0.12) 0%, transparent 65%);
    pointer-events: none; z-index: 0;
  }
  body::after {
    content: '';
    position: fixed; bottom: -150px; right: -150px;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(201,168,76,0.08) 0%, transparent 65%);
    pointer-events: none; z-index: 0;
  }

  /* ── HEADER ── */
  #header {
    background: rgba(8,0,16,0.95) !important;
    backdrop-filter: blur(20px) !important;
    border-bottom: 1px solid var(--glass-border) !important;
    padding: 0 20px !important;
    height: 56px !important;
    display: flex !important;
    align-items: center !important;
    position: sticky !important;
    top: 0 !important;
    z-index: 1000 !important;
    box-shadow: 0 1px 30px rgba(124,63,191,0.1) !important;
  }
  #header::after {
    content: '';
    position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), var(--purple-light), transparent);
    opacity: 0.4;
  }
  #branding h1, #branding h1 a {
    font-family: 'Cinzel', serif !important;
    color: var(--gold) !important;
    font-size: 18px !important;
    letter-spacing: 3px !important;
    text-decoration: none !important;
    font-weight: 600 !important;
  }
  #user-tools {
    color: var(--text-dim) !important;
    font-size: 12px !important;
    letter-spacing: 1px !important;
  }
  #user-tools a {
    color: var(--gold) !important;
    text-decoration: none !important;
    border: 1px solid rgba(201,168,76,0.25) !important;
    padding: 4px 12px !important;
    border-radius: 6px !important;
    font-size: 11px !important;
    letter-spacing: 1px !important;
    transition: all 0.2s !important;
  }
  #user-tools a:hover {
    background: var(--gold-dim) !important;
    border-color: var(--gold) !important;
  }

  /* ── BREADCRUMBS ── */
  div.breadcrumbs {
    background: transparent !important;
    border-bottom: 1px solid var(--glass-border) !important;
    color: var(--text-muted) !important;
    font-size: 12px !important;
    letter-spacing: 1px !important;
    padding: 10px 20px !important;
  }
  div.breadcrumbs a { color: var(--purple-light) !important; text-decoration: none !important; }
  div.breadcrumbs a:hover { color: var(--gold) !important; }

  /* ── SIDEBAR / NAV ── */
  #nav-sidebar, .toggle-nav-sidebar {
    background: rgba(8,0,16,0.98) !important;
    border-right: 1px solid var(--glass-border) !important;
  }
  #nav-sidebar .module caption,
  #nav-sidebar th {
    background: transparent !important;
    color: var(--gold) !important;
    font-family: 'Cinzel', serif !important;
    font-size: 11px !important;
    letter-spacing: 3px !important;
    text-transform: uppercase !important;
    padding: 12px 16px 8px !important;
    border-bottom: 1px solid var(--glass-border-gold) !important;
  }
  #nav-sidebar td, #nav-sidebar .viewlink,
  #nav-sidebar a {
    color: var(--text-dim) !important;
    font-size: 13px !important;
    text-decoration: none !important;
    padding: 6px 16px !important;
    display: block !important;
    transition: all 0.2s !important;
    letter-spacing: 0.5px !important;
  }
  #nav-sidebar a:hover {
    color: var(--gold) !important;
    background: var(--gold-dim) !important;
    border-left: 2px solid var(--gold) !important;
    padding-left: 14px !important;
  }

  /* ── MAIN CONTENT ── */
  #main, #content, .colMS, #content-main {
    background: transparent !important;
    position: relative; z-index: 1;
  }
  #content { padding: 24px !important; }

  /* ── PAGE TITLE ── */
  #content h1 {
    font-family: 'Cinzel', serif !important;
    color: var(--text) !important;
    font-size: 22px !important;
    font-weight: 400 !important;
    letter-spacing: 2px !important;
    margin-bottom: 24px !important;
    padding-bottom: 12px !important;
    border-bottom: 1px solid var(--glass-border) !important;
    position: relative !important;
  }
  #content h1::after {
    content: '';
    position: absolute; bottom: -1px; left: 0; width: 80px; height: 1px;
    background: linear-gradient(90deg, var(--gold), transparent);
  }

  /* ── MODULES / CARDS ── */
  .module {
    background: var(--glass) !important;
    border: 1px solid var(--glass-border) !important;
    border-radius: 12px !important;
    overflow: hidden !important;
    margin-bottom: 20px !important;
    backdrop-filter: blur(8px) !important;
    position: relative !important;
  }
  .module::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(201,168,76,0.3), rgba(124,63,191,0.3), transparent);
  }
  .module h2, .module caption, .module thead th {
    background: rgba(124,63,191,0.08) !important;
    color: var(--gold) !important;
    font-family: 'Cinzel', serif !important;
    font-size: 12px !important;
    letter-spacing: 3px !important;
    text-transform: uppercase !important;
    padding: 12px 16px !important;
    border-bottom: 1px solid var(--glass-border) !important;
    font-weight: 600 !important;
  }

  /* ── TABLES ── */
  #result_list {
    background: transparent !important;
    border: none !important;
    width: 100% !important;
    border-collapse: collapse !important;
  }
  #result_list thead th {
    background: rgba(124,63,191,0.08) !important;
    color: var(--gold) !important;
    font-size: 11px !important;
    letter-spacing: 2px !important;
    text-transform: uppercase !important;
    padding: 12px 16px !important;
    border-bottom: 1px solid var(--glass-border) !important;
    font-family: 'Cinzel', serif !important;
  }
  #result_list thead th a {
    color: var(--gold) !important;
    text-decoration: none !important;
  }
  #result_list tbody tr {
    border-bottom: 1px solid rgba(255,255,255,0.04) !important;
    transition: background 0.2s !important;
  }
  #result_list tbody tr:hover {
    background: rgba(201,168,76,0.04) !important;
  }
  #result_list tbody td {
    color: var(--text-dim) !important;
    padding: 12px 16px !important;
    font-size: 13px !important;
  }
  #result_list tbody td a {
    color: var(--purple-light) !important;
    text-decoration: none !important;
    transition: color 0.2s !important;
  }
  #result_list tbody td a:hover { color: var(--gold) !important; }
  #result_list tr.selected td { background: rgba(201,168,76,0.06) !important; }

  /* ── BUTTONS ── */
  .button, input[type=submit], input[type=button],
  .submit-row input, a.button {
    background: linear-gradient(135deg, rgba(124,63,191,0.3), rgba(201,168,76,0.2)) !important;
    border: 1px solid rgba(201,168,76,0.3) !important;
    color: var(--gold) !important;
    border-radius: 8px !important;
    padding: 8px 18px !important;
    font-size: 12px !important;
    letter-spacing: 1px !important;
    text-transform: uppercase !important;
    cursor: pointer !important;
    transition: all 0.2s !important;
    font-family: 'Inter', sans-serif !important;
  }
  .button:hover, input[type=submit]:hover {
    background: linear-gradient(135deg, rgba(124,63,191,0.5), rgba(201,168,76,0.3)) !important;
    border-color: var(--gold) !important;
    box-shadow: 0 0 16px rgba(201,168,76,0.2) !important;
  }
  .button.default, input[type=submit].default {
    background: linear-gradient(135deg, var(--purple), #a06c0a) !important;
    color: #fff !important;
    border-color: transparent !important;
  }
  .deletelink {
    background: rgba(220,50,50,0.1) !important;
    border-color: rgba(220,50,50,0.3) !important;
    color: #ff6b6b !important;
  }

  /* ── FORMS ── */
  .form-row, .form-group {
    border-bottom: 1px solid rgba(255,255,255,0.04) !important;
    padding: 12px 0 !important;
  }
  input[type=text], input[type=email], input[type=password],
  input[type=number], input[type=url], textarea, select {
    background: rgba(255,255,255,0.04) !important;
    border: 1px solid var(--glass-border) !important;
    border-radius: 8px !important;
    color: var(--text) !important;
    padding: 8px 12px !important;
    font-size: 13px !important;
    font-family: 'Inter', sans-serif !important;
    transition: border-color 0.2s !important;
    width: 100% !important;
  }
  input[type=text]:focus, textarea:focus, select:focus {
    border-color: var(--purple-light) !important;
    outline: none !important;
    box-shadow: 0 0 0 2px rgba(124,63,191,0.15) !important;
  }
  label { color: var(--text-dim) !important; font-size: 12px !important; letter-spacing: 1px !important; }
  .help { color: var(--text-muted) !important; font-size: 11px !important; }

  /* ── SUBMIT ROW ── */
  .submit-row {
    background: rgba(8,0,16,0.8) !important;
    border: 1px solid var(--glass-border) !important;
    border-radius: 10px !important;
    padding: 12px 16px !important;
    backdrop-filter: blur(8px) !important;
  }

  /* ── PAGINATION ── */
  .paginator {
    color: var(--text-muted) !important;
    font-size: 12px !important;
  }
  .paginator a {
    color: var(--purple-light) !important;
    border: 1px solid var(--glass-border) !important;
    padding: 4px 10px !important;
    border-radius: 6px !important;
    text-decoration: none !important;
    margin: 0 2px !important;
    transition: all 0.2s !important;
  }
  .paginator a:hover {
    background: var(--purple-dim) !important;
    border-color: var(--purple-light) !important;
    color: var(--gold) !important;
  }
  .paginator .this-page {
    background: var(--gold-dim) !important;
    border: 1px solid var(--gold) !important;
    color: var(--gold) !important;
    padding: 4px 10px !important;
    border-radius: 6px !important;
  }

  /* ── SEARCH BAR ── */
  #searchbar, #toolbar input[type=text] {
    background: rgba(255,255,255,0.04) !important;
    border: 1px solid var(--glass-border) !important;
    border-radius: 8px !important;
    color: var(--text) !important;
    padding: 8px 14px !important;
    font-size: 13px !important;
  }
  #toolbar input[type=submit] {
    background: var(--purple-dim) !important;
    border-color: var(--purple-light) !important;
    color: var(--purple-light) !important;
  }

  /* ── FILTERS ── */
  #changelist-filter {
    background: var(--glass) !important;
    border: 1px solid var(--glass-border) !important;
    border-radius: 12px !important;
    overflow: hidden !important;
  }
  #changelist-filter h2 {
    background: rgba(124,63,191,0.08) !important;
    color: var(--gold) !important;
    font-family: 'Cinzel', serif !important;
    font-size: 11px !important;
    letter-spacing: 3px !important;
    padding: 12px 16px !important;
    border-bottom: 1px solid var(--glass-border) !important;
  }
  #changelist-filter h3 { color: var(--text-dim) !important; font-size: 11px !important; letter-spacing: 2px !important; padding: 10px 16px 4px !important; }
  #changelist-filter ul { list-style: none !important; padding: 0 !important; }
  #changelist-filter li { border-bottom: 1px solid rgba(255,255,255,0.03) !important; }
  #changelist-filter li a {
    color: var(--text-muted) !important; font-size: 12px !important;
    padding: 7px 16px !important; display: block !important;
    text-decoration: none !important; transition: all 0.2s !important;
  }
  #changelist-filter li a:hover { color: var(--gold) !important; background: var(--gold-dim) !important; }
  #changelist-filter li.selected a { color: var(--gold) !important; font-weight: 500 !important; }

  /* ── MESSAGES ── */
  .messagelist li {
    background: rgba(124,63,191,0.1) !important;
    border: 1px solid rgba(124,63,191,0.25) !important;
    border-radius: 8px !important;
    color: var(--purple-light) !important;
    padding: 10px 16px !important;
    font-size: 13px !important;
    margin-bottom: 8px !important;
  }
  .messagelist li.success {
    background: rgba(40,180,100,0.08) !important;
    border-color: rgba(40,180,100,0.2) !important;
    color: #5dcc8a !important;
  }
  .messagelist li.error {
    background: rgba(220,50,50,0.08) !important;
    border-color: rgba(220,50,50,0.2) !important;
    color: #ff6b6b !important;
  }

  /* ── INLINE TABLES ── */
  .inline-group {
    background: var(--glass) !important;
    border: 1px solid var(--glass-border) !important;
    border-radius: 12px !important;
    overflow: hidden !important;
    margin-top: 20px !important;
  }
  .inline-group h2 {
    background: rgba(124,63,191,0.08) !important;
    color: var(--gold) !important;
    font-family: 'Cinzel', serif !important;
    font-size: 12px !important;
    letter-spacing: 3px !important;
    padding: 12px 16px !important;
    border-bottom: 1px solid var(--glass-border) !important;
  }

  /* ── OBJECT TOOLS ── */
  .object-tools a {
    background: var(--purple-dim) !important;
    border: 1px solid rgba(124,63,191,0.3) !important;
    color: var(--purple-light) !important;
    border-radius: 8px !important;
    padding: 6px 14px !important;
    font-size: 11px !important;
    letter-spacing: 1px !important;
    text-decoration: none !important;
    text-transform: uppercase !important;
    transition: all 0.2s !important;
  }
  .object-tools a:hover {
    background: rgba(124,63,191,0.25) !important;
    border-color: var(--purple-light) !important;
    color: var(--gold) !important;
  }
  .object-tools a.addlink {
    background: var(--gold-dim) !important;
    border-color: rgba(201,168,76,0.3) !important;
    color: var(--gold) !important;
  }

  /* ── DASHBOARD INDEX ── */
  #content-main .module table {
    width: 100% !important;
  }
  #content-main .module td { padding: 8px 16px !important; border-bottom: 1px solid rgba(255,255,255,0.03) !important; }
  #content-main .module td a { color: var(--text-dim) !important; text-decoration: none !important; font-size: 13px !important; transition: color 0.2s !important; }
  #content-main .module td a:hover { color: var(--gold) !important; }
  .addlink { color: var(--gold) !important; }
  .changelink { color: var(--purple-light) !important; }

  /* ── RECENT ACTIONS ── */
  #recent-actions-module .actionlist li {
    border-bottom: 1px solid rgba(255,255,255,0.04) !important;
    padding: 8px 0 !important;
    font-size: 12px !important;
  }
  #recent-actions-module .actionlist a { color: var(--purple-light) !important; text-decoration: none !important; }
  #recent-actions-module .actionlist a:hover { color: var(--gold) !important; }
  .deletelink-popup { color: #ff6b6b !important; }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: rgba(124,63,191,0.3); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(201,168,76,0.4); }

  /* ── CALENDAR / DATETIME ── */
  .calendarbox, .clockbox {
    background: var(--bg2) !important;
    border: 1px solid var(--glass-border) !important;
    border-radius: 10px !important;
  }

  /* ── SELECT2 ── */
  .select2-container--admin-autocomplete .select2-selection {
    background: rgba(255,255,255,0.04) !important;
    border-color: var(--glass-border) !important;
    border-radius: 8px !important;
  }

  /* ── FOOTER ── */
  #footer {
    background: transparent !important;
    border-top: 1px solid var(--glass-border) !important;
    color: var(--text-muted) !important;
    font-size: 11px !important;
    letter-spacing: 2px !important;
    text-align: center !important;
    padding: 16px !important;
  }
</style>
{% endblock %}

{% block nav-global %}{% endblock %}
